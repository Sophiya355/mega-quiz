<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Championship - Points Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #ffd700;
      --gold-glow: rgba(255, 215, 0, 0.5);
      --cyan-border: #00d2ff;
      --cyan-glow: rgba(0, 210, 255, 0.45);
      --bg-card: linear-gradient(180deg, rgba(22, 10, 52, 0.95) 0%, rgba(12, 5, 30, 0.98) 100%);
      --grid-border: rgba(95, 80, 165, 0.38);
      --text-white: #ffffff;
      --text-gold: #ffde59;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0d0620;
      background-image: url('background%20image.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(8px, 1.8vw, 24px) clamp(8px, 1.5vw, 18px);
      position: relative;
      overflow-x: hidden;
    }

    /* Container: positioned in stage arch area */
    .container {
      width: 100%;
      max-width: 1200px;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: calc(clamp(125px, 14.5vh, 155px) + 1cm);
    }

    /* ========================================================
       CHAMPIONSHIP POINTS TABLE CARD (WITH DRAMATIC ENTRANCE)
       ======================================================== */
    .points-card {
      width: 100%;
      position: relative;
      background: var(--bg-card);
      border: 3.5px solid #f6c034;
      border-radius: clamp(22px, 2.6vw, 30px);
      box-shadow: 
        0 0 38px rgba(246, 192, 52, 0.48),
        0 20px 50px rgba(0, 0, 0, 0.88),
        inset 0 0 20px rgba(246, 192, 52, 0.24);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: clamp(18px, 2.4vh, 26px) clamp(20px, 2.4vw, 32px) clamp(10px, 1.3vh, 16px);
      box-sizing: border-box;

      /* Initially hidden - emerges 'from nowhere' */
      opacity: 0;
      transform: scale(0.2) translateY(120px);
      filter: blur(20px);
      pointer-events: none;
      transition: 
        opacity 1.1s cubic-bezier(0.19, 1, 0.22, 1),
        transform 1.1s cubic-bezier(0.19, 1, 0.22, 1),
        filter 1s ease;
    }

    /* Revealed state for points-card */
    .points-card.revealed {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0px);
      pointer-events: auto;
    }

    /* Slot where the headtag will dock atop the table */
    .table-headtag-slot {
      position: absolute;
      top: calc(-118px - 0.25cm);
      left: 50%;
      transform: translateX(-50%);
      width: clamp(350px, 40vw, 520px);
      height: clamp(118px, 13.5vw, 176px);
      pointer-events: none;
      z-index: 25;
    }

    /* ========================================================
       FLOATING HERO HEADTAG ANIMATION
       ======================================================== */
    .hero-headtag-wrapper {
      position: fixed;
      z-index: 1000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(450px, 55vw, 820px);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: 
        top 1.1s cubic-bezier(0.25, 1, 0.5, 1),
        left 1.1s cubic-bezier(0.25, 1, 0.5, 1),
        width 1.1s cubic-bezier(0.25, 1, 0.5, 1),
        transform 1.1s cubic-bezier(0.25, 1, 0.5, 1),
        filter 1s ease;
    }

    .hero-headtag-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.75)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
      transform-style: preserve-3d;
    }

    /* 3D Spin Animation */
    .hero-headtag-img.spinning {
      animation: spin3D 1.3s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
    }

    @keyframes spin3D {
      0% {
        transform: rotateY(0deg) scale(1);
        filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.75)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
      }
      50% {
        transform: rotateY(360deg) scale(1.18);
        filter: drop-shadow(0 0 70px rgba(255, 235, 100, 1)) drop-shadow(0 20px 45px rgba(0, 0, 0, 0.95)) brightness(1.25);
      }
      100% {
        transform: rotateY(720deg) scale(1);
        filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.75)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
      }
    }

    /* Docked state atop points table */
    .hero-headtag-wrapper.docked {
      position: absolute !important;
      top: calc(-118px - 0.25cm) !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: clamp(350px, 40vw, 520px) !important;
      height: auto !important;
      pointer-events: auto;
      z-index: 25;
      transition: none !important;
    }

    .hero-headtag-wrapper.docked .hero-headtag-img {
      animation: none !important;
      transform: none !important;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.55));
    }

    /* ========================================================
       STANDBY "WELCOME TO" HERO RIBBON BANNER
       ======================================================== */
    .standby-welcome-tag {
      position: fixed;
      top: clamp(80px, 12vh, 140px);
      left: 50%;
      transform: translateX(-50%);
      width: clamp(280px, 30vw, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      animation: welcomeFloat 3.8s ease-in-out infinite alternate;
    }

    .standby-welcome-tag.hidden {
      opacity: 0 !important;
      transform: translate(-50%, -40px) scale(0.9) !important;
      pointer-events: none !important;
      animation: none !important;
    }

    .welcome-ribbon-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 45px rgba(168, 85, 247, 0.45));
    }

    @keyframes welcomeFloat {
      0% {
        transform: translate(-50%, 0);
      }
      100% {
        transform: translate(-50%, -10px);
      }
    }

    /* Radial burst shockwave when table appears */
    .reveal-shockwave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.7) 0%, rgba(255, 180, 0, 0.3) 40%, transparent 70%);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 15;
    }

    .reveal-shockwave.active {
      animation: shockwaveBurst 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes shockwaveBurst {
      0% {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 1;
      }
      60% {
        transform: translate(-50%, -50%) scale(4.8);
        opacity: 0.65;
      }
      100% {
        transform: translate(-50%, -50%) scale(7.5);
        opacity: 0;
      }
    }

    /* Replay Button */
    .replay-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(18, 9, 44, 0.88);
      border: 1.5px solid rgba(246, 192, 52, 0.65);
      color: #ffe066;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      z-index: 999;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .replay-btn:hover {
      background: rgba(30, 15, 70, 0.95);
      border-color: #ffd700;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.55);
      transform: translateY(-2px);
    }

    /* Active Round Highlight in Header */
    .round-pill.active-round {
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.45) 0%, rgba(0, 140, 255, 0.75) 100%) !important;
      border-color: #00ffff !important;
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.95), inset 0 0 12px rgba(255, 255, 255, 0.7) !important;
      color: #ffffff !important;
      animation: activeRoundPulse 1.8s infinite ease-in-out;
    }
    @keyframes activeRoundPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(0, 255, 255, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 28px rgba(0, 255, 255, 1), inset 0 0 16px rgba(255, 255, 255, 0.9); }
    }

    /* Rank Change Row Animation */
    .points-table tbody tr {
      position: relative;
      transition: transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s ease;
      will-change: transform;
    }
    .row-rank-changed {
      animation: rowFlash 1.2s ease-out;
    }
    @keyframes rowFlash {
      0% { filter: brightness(1.7) drop-shadow(0 0 25px rgba(255, 215, 0, 0.95)); }
      100% { filter: none; }
    }

    /* Round Announcement Overlay */
    .round-announcement-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 4, 25, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    .round-announcement-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .round-banner-card {
      background: linear-gradient(135deg, rgba(28, 12, 65, 0.97) 0%, rgba(15, 5, 38, 0.98) 100%);
      border: 3.5px solid #ffd700;
      border-radius: 28px;
      padding: clamp(28px, 4.5vh, 48px) clamp(36px, 5.5vw, 68px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 
        0 0 65px rgba(255, 215, 0, 0.65),
        0 25px 65px rgba(0, 0, 0, 0.95),
        inset 0 0 25px rgba(255, 215, 0, 0.25);
      transform: scale(0.6) rotateX(25deg);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .round-announcement-overlay.visible .round-banner-card {
      transform: scale(1) rotateX(0deg);
    }
    .round-banner-tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(0, 210, 255, 0.25);
      border: 1.5px solid #00d2ff;
      color: #00ffff;
      font-size: clamp(0.85rem, 1.1vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.7);
    }
    .round-banner-prev {
      font-size: clamp(1.4rem, 2.2vw, 2.2rem);
      font-weight: 800;
      color: #ff9999;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 80, 80, 0.55);
    }
    .round-banner-arrow {
      font-size: clamp(1.6rem, 2.5vw, 2.5rem);
      color: #ffd700;
      margin: 8px 0;
      animation: arrowBounce 1s infinite alternate ease-in-out;
    }
    @keyframes arrowBounce {
      0% { transform: translateY(-4px); }
      100% { transform: translateY(6px); }
    }
    .round-banner-next {
      font-size: clamp(2.2rem, 3.8vw, 3.6rem);
      font-weight: 900;
      color: #ffe066;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 
        0 0 25px rgba(255, 215, 0, 0.85),
        0 4px 12px rgba(0, 0, 0, 0.9);
      margin-bottom: 12px;
    }
    .round-banner-sub {
      font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      color: #d1c4e9;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    /* Live Sheet Sync Pill */
    .live-sync-pill {
      position: fixed;
      top: 18px;
      left: 18px;
      background: rgba(18, 9, 44, 0.88);
      border: 1.5px solid rgba(0, 210, 255, 0.55);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      z-index: 999;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      transition: all 0.3s ease;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      animation: syncBlink 2s infinite ease-in-out;
    }
    @keyframes syncBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }
    .sync-action-badge {
      background: rgba(255, 215, 0, 0.22);
      border: 1px solid rgba(255, 215, 0, 0.7);
      color: #ffd700;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
    }

    /* Table Layout */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(246, 192, 52, 0.5) transparent;
    }

    .table-responsive::-webkit-scrollbar {
      height: 6px;
    }
    .table-responsive::-webkit-scrollbar-thumb {
      background: rgba(246, 192, 52, 0.5);
      border-radius: 4px;
    }

    .points-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 clamp(7px, 1.0vh, 12px);
      min-width: 720px;
    }

    /* ========================================================
       HEADERS
       ======================================================== */
    .points-table thead tr th {
      padding: clamp(6px, 0.9vh, 10px) 6px;
      vertical-align: middle;
      font-weight: 800;
      border: none;
      user-select: none;
    }

    /* TEAM Header */
    .col-team-head {
      width: 25%;
      text-align: left;
      padding-left: clamp(14px, 1.8vw, 24px) !important;
    }

    .team-header-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffd700;
      font-size: clamp(1.05rem, 1.3vw, 1.25rem);
      font-weight: 900;
      letter-spacing: 0.8px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .team-header-pill .crown-icon-sm {
      width: 24px;
      height: 20px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.75));
    }

    /* ROUND 1-5 Headers (Dark Sleek Capsules with Silver Rim) */
    .col-round-head {
      width: 12%;
      text-align: center;
    }

    .round-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(5px, 0.7vh, 7px) clamp(14px, 1.6vw, 20px);
      border-radius: 999px;
      background: linear-gradient(180deg, #32254f 0%, #170d2c 100%);
      border: 1.8px solid #958ba8;
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        0 3px 8px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-size: clamp(0.78rem, 0.95vw, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .round-pill:hover {
      box-shadow: 
        0 0 15px rgba(180, 150, 255, 0.65),
        inset 0 0 8px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    /* TOTAL Header with Perched 3D Crown */
    .col-total-head {
      width: 15%;
      text-align: center;
      position: relative;
    }

    .total-header-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin-top: 14px;
    }

    .crown-total-perched {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(38px, 4.2vw, 48px);
      height: clamp(24px, 2.6vw, 30px);
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 10px rgba(255, 215, 0, 0.75));
      animation: crownShine 3.5s infinite ease-in-out;
    }

    @keyframes crownShine {
      0%, 100% { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 10px rgba(255, 215, 0, 0.65)); }
      50% { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 18px rgba(255, 235, 100, 0.95)); }
    }

    .total-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(5px, 0.7vh, 7px) clamp(18px, 2.2vw, 26px);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(45, 20, 75, 0.85) 0%, rgba(20, 8, 38, 0.95) 100%);
      border: 2px solid #ffd700;
      box-shadow: 
        0 0 14px rgba(255, 215, 0, 0.45),
        inset 0 0 8px rgba(255, 215, 0, 0.2);
      color: #ffd700;
      font-size: clamp(0.88rem, 1.1vw, 1.05rem);
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ========================================================
       FLOATING 3D CAPSULE ROWS & CELLS
       ======================================================== */
    .row-capsule {
      position: relative;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .row-capsule td {
      background: linear-gradient(180deg, #23124d 0%, #12062d 100%);
      border-top: 2.4px solid #f6c034;
      border-bottom: 2.4px solid #b87a00;
      color: #ffffff;
      padding: clamp(8px, 1.15vh, 12px) clamp(8px, 1.0vw, 14px);
      text-align: center;
      font-weight: 800;
      position: relative;
      box-shadow: inset 0 1.5px 2px rgba(255, 235, 140, 0.4), inset 0 -1.5px 2px rgba(0, 0, 0, 0.6);
      font-variant-numeric: tabular-nums;
    }

    /* Left Capsule Cap (Team Cell) */
    .row-capsule td:first-child {
      border-left: 2.4px solid #f6c034;
      border-top-left-radius: 999px;
      border-bottom-left-radius: 999px;
      text-align: left;
      padding-left: clamp(14px, 1.6vw, 22px);
      padding-right: clamp(16px, 1.8vw, 24px);
    }

    /* Curved Pill Divider after Team */
    .row-capsule td:first-child::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -2.4px;
      bottom: -2.4px;
      width: 22px;
      border-right: 2.4px solid #f6c034;
      border-top-right-radius: 999px;
      border-bottom-right-radius: 999px;
      pointer-events: none;
      z-index: 2;
    }

    /* Middle Round Score Cells */
    .row-capsule td:not(:first-child):not(:last-child) {
      border-right: 1px solid rgba(255, 215, 0, 0.28);
      font-size: clamp(1.05rem, 1.3vw, 1.22rem);
      font-weight: 800;
      color: #ffffff;
    }

    /* Right Capsule Cap (Total Cell) */
    .row-capsule td:last-child {
      border-right: 2.4px solid #f6c034;
      border-top-right-radius: 999px;
      border-bottom-right-radius: 999px;
      color: #ffd700;
      font-size: clamp(1.35rem, 1.7vw, 1.62rem);
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      padding-left: clamp(14px, 1.8vw, 24px);
      padding-right: clamp(14px, 1.8vw, 24px);
    }

    /* Curved Pill Divider before Total */
    .row-capsule td:last-child::before {
      content: '';
      position: absolute;
      left: -1px;
      top: -2.4px;
      bottom: -2.4px;
      width: 22px;
      border-left: 2.4px solid #f6c034;
      border-top-left-radius: 999px;
      border-bottom-left-radius: 999px;
      pointer-events: none;
      z-index: 2;
    }

    .row-capsule:hover td {
      filter: brightness(1.08);
    }

    /* Team Cell (Badges + Name) */
    .team-cell {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.3vw, 16px);
    }

    .team-name {
      font-size: clamp(1.05rem, 1.3vw, 1.22rem);
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 0.25px;
    }

    /* ========================================================
       RANK 1: GLOWING 24K GOLD WINNER CAPSULE
       ======================================================== */
    .row-rank-1 {
      filter: drop-shadow(0 0 18px rgba(255, 195, 0, 0.75));
    }

    .row-rank-1 td {
      background: linear-gradient(90deg, #d38d00 0%, #f6bc18 20%, #ffde59 50%, #f6bc18 80%, #d38d00 100%) !important;
      border-top: 2.5px solid #fff8a8 !important;
      border-bottom: 2.5px solid #a66a00 !important;
      color: #ffffff !important;
      box-shadow: inset 0 2px 2px rgba(255, 255, 255, 0.8), inset 0 -2px 2px rgba(100, 50, 0, 0.45) !important;
    }

    // Smooth FLIP Animated Reordering (supports normal score update & finale suspense shuffle)
    function updateLeaderboardWithAnimation(newTeamsData, isShuffle = false, customDuration = null) {
      if (!newTeamsData || newTeamsData.length === 0) return;

      if (!isShuffle) {
        // Sort descending by total score
        newTeamsData.sort((a, b) => b.total - a.total);
        newTeamsData.forEach((item, idx) => {
          item.rank = idx + 1;
        });
      }

      const tbody = document.getElementById('leaderboard-body');
      const existingRows = Array.from(tbody.querySelectorAll('tr'));

      // 1. Record old positions
      const oldPositions = new Map();
      existingRows.forEach(row => {
        const team = row.dataset.team;
        if (team) {
          oldPositions.set(team, row.getBoundingClientRect().top);
        }
      });

      // 2. Render new rows
      renderLeaderboard(newTeamsData);
      if (!isShuffle) {
        currentLeaderboard = newTeamsData;
      }

      // 3. Invert positions
      const newRows = Array.from(tbody.querySelectorAll('tr'));
      newRows.forEach(row => {
        const team = row.dataset.team;
        if (oldPositions.has(team)) {
          const oldTop = oldPositions.get(team);
          const newTop = row.getBoundingClientRect().top;
          const deltaY = oldTop - newTop;

          if (Math.abs(deltaY) > 2) {
            row.style.transform = `translateY(${deltaY}px)`;
            row.style.transition = 'none';
            // Any team climbing up (deltaY > 0) floats above all other rows
            if (deltaY > 0) {
              row.style.zIndex = `${50 + Math.min(Math.round(deltaY), 500)}`;
            } else {
              row.style.zIndex = '1';
            }
            if (isShuffle) {
              row.classList.add('row-shuffling');
            } else {
              row.classList.add('row-rank-changed');
            }
          }
        }
      });

      // 4. Play smooth transition
      requestAnimationFrame(() => {
        const duration = isShuffle ? '0.2s cubic-bezier(0.2, 0.8, 0.2, 1)' : (customDuration || '1.8s cubic-bezier(0.25, 1, 0.5, 1)');
        newRows.forEach(row => {
          row.style.transition = `transform ${duration}, background 0.4s ease`;
          row.style.transform = '';
        });
        setTimeout(() => {
          newRows.forEach(row => {
            row.style.zIndex = '';
          });
        }, isShuffle ? 300 : 2000);
      });
    }

    // ========================================================
    // CONFETTI POPPER CANNON SYSTEM (HIGH PERFORMANCE CANVAS)
    // ========================================================
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d') : null;
    let confettiParticles = [];
    let confettiAnimId = null;
    let isConfettiActive = false;

    function resizeConfettiCanvas() {
      if (!confettiCanvas) return;
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);

    const CONFETTI_COLORS = [
      '#ffd700', '#ffb700', '#fff275', // Gold / Yellow
      '#00f5d4', '#00bbf9', '#70e000', // Cyan / Emerald
      '#f72585', '#b5179e', '#7209b7', // Magenta / Violet
      '#ff5400', '#ff0054', '#ffffff'  // Bright Orange / Crimson / White
    ];

    function createConfettiPiece(x, y, angleDeg, speedRange) {
      const angleRad = (angleDeg * Math.PI) / 180;
      const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
      return {
        x: x,
        y: y,
        vx: Math.cos(angleRad) * speed,
        vy: Math.sin(angleRad) * speed,
        size: 9 + Math.random() * 8,
        length: 14 + Math.random() * 12,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 14,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.08 + Math.random() * 0.08,
        gravity: 0.38 + Math.random() * 0.16,
        drag: 0.985
      };
    }

    function launchConfettiBurst() {
      resizeConfettiCanvas();
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Cannon Left: Firing up-right
      for (let i = 0; i < 95; i++) {
        confettiParticles.push(createConfettiPiece(w * 0.08, h + 15, -65 + (Math.random() - 0.5) * 45, [20, 36]));
      }

      // Cannon Right: Firing up-left
      for (let i = 0; i < 95; i++) {
        confettiParticles.push(createConfettiPiece(w * 0.92, h + 15, -115 + (Math.random() - 0.5) * 45, [20, 36]));
      }

      if (!isConfettiActive) {
        isConfettiActive = true;
        animateConfetti();
      }
    }

    function animateConfetti() {
      if (!confettiCtx || !isConfettiActive) return;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx + Math.sin(p.wobble) * 1.5;
        p.y += p.vy;
        p.wobble += p.wobbleSpeed;
        p.rotation += p.rotationSpeed;

        if (p.y > window.innerHeight + 60) {
          confettiParticles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size / 2, -p.length / 2, p.size, p.length);
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        isConfettiActive = false;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    function stopConfetti() {
      isConfettiActive = false;
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      confettiParticles = [];
      if (confettiCtx && confettiCanvas) {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    function triggerEndRound5Finale(teamsData) {
      if (isFinaleActive) return;
      isFinaleActive = true;
      isRound5Active = false; // Reveal Round 5 scores on finale resolution

      console.log('[GRAND FINALE] Initiating End of Round 5 ceremony...');
      setSyncBadge('🏆 FINALE', '#ffd700');

      const welcomeTag = document.getElementById('standby-welcome-tag');
      if (welcomeTag) welcomeTag.classList.add('hidden');

      // Ensure table is revealed and docked if jumping straight to finale from standby
      const heroWrapper = document.getElementById('hero-headtag-wrapper');
      const tableCard = document.querySelector('.points-card');
      if (tableCard) {
        tableCard.style.transition = 'none';
        tableCard.classList.add('revealed');
        tableCard.classList.remove('exit-down');
        void tableCard.offsetHeight;
        tableCard.style.transition = '';
      }
      if (heroWrapper) {
        heroWrapper.classList.remove('vanish');
        if (tableCard && heroWrapper.parentElement !== tableCard) {
          tableCard.appendChild(heroWrapper);
          heroWrapper.classList.add('docked');
          heroWrapper.style.position = '';
          heroWrapper.style.top = '';
          heroWrapper.style.left = '';
          heroWrapper.style.width = '';
          heroWrapper.style.transform = '';
        }
      }
      isIntroPlayed = true;

      // 1. Calculate true final rankings sorted descending by total score
      const sourceTeams = (teamsData && teamsData.length) ? teamsData : (latestRawTeamsData || currentLeaderboard);
      const sortedTeams = sourceTeams.map(t => {
        const rawRounds = (t.fullRounds && t.fullRounds.length === 5) ? t.fullRounds : t.rounds;
        const validRounds = rawRounds.map(r => {
          const n = parseFloat(r);
          return isNaN(n) ? 0 : n;
        });
        const computedTotal = (typeof t.fullTotal === 'number' && !isNaN(t.fullTotal) && t.fullTotal > 0)
          ? t.fullTotal
          : ((typeof t.total === 'number' && !isNaN(t.total) && t.total > 0)
              ? t.total
              : validRounds.reduce((a, b) => a + b, 0));
        return {
          team: t.team,
          rounds: validRounds,
          total: computedTotal,
          revealR5: true
        };
      });
      sortedTeams.sort((a, b) => b.total - a.total);
      sortedTeams.forEach((t, idx) => t.rank = idx + 1);

      // 2. 5-Second Suspense Shuffle Phase
      const tbody = document.getElementById('leaderboard-body');
      const shuffleDurationMs = 5000;
      const startTime = Date.now();

      if (finaleIntervalId) clearInterval(finaleIntervalId);
      finaleIntervalId = setInterval(() => {
        try {
          const elapsed = Date.now() - startTime;
          if (elapsed < shuffleDurationMs) {
            // Permute array randomly
            const shuffled = [...sortedTeams];
            for (let i = shuffled.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            shuffled.forEach((t, i) => t.rank = i + 1);
            updateLeaderboardWithAnimation(shuffled, true);
          } else {
            // 5 seconds elapsed! Halt shuffle
            clearInterval(finaleIntervalId);
            finaleIntervalId = null;

            // 3. Settle to verified final true rankings slowly & gracefully!
            updateLeaderboardWithAnimation(sortedTeams, false, '3.2s cubic-bezier(0.2, 0.8, 0.25, 1)');
            setSyncBadge('🏆 RESOLVED', '#ffd700');

            // Flash rows with celebratory gold glow
            if (tbody) {
              tbody.querySelectorAll('tr').forEach(r => {
                r.classList.remove('row-shuffling');
                r.classList.add('row-rank-changed');
              });
            }

            // 4. Keep scoreboard fully visible for 7.5s (3.2s slow glide + 4.3s display) so everyone sees final scores!
            finaleTimer1 = setTimeout(() => {
              try {
                const hw = document.getElementById('hero-headtag-wrapper');
                const tc = document.querySelector('.points-card');
                if (hw) hw.classList.add('vanish');
                if (tc) tc.classList.add('exit-down');

                // 5. Rise the Podium
                finaleTimer2 = setTimeout(() => {
                  try {
                    const top1 = sortedTeams[0] || { team: '1st Place', total: 0 };
                    const top2 = sortedTeams[1] || { team: '2nd Place', total: 0 };
                    const top3 = sortedTeams[2] || { team: '3rd Place', total: 0 };

                    const elT1 = document.getElementById('podium-team-1');
                    const elS1 = document.getElementById('podium-score-1');
                    const elT2 = document.getElementById('podium-team-2');
                    const elS2 = document.getElementById('podium-score-2');
                    const elT3 = document.getElementById('podium-team-3');
                    const elS3 = document.getElementById('podium-score-3');

                    if (elT1) elT1.textContent = top1.team;
                    if (elS1) elS1.textContent = top1.total + ' pts';
                    if (elT2) elT2.textContent = top2.team;
                    if (elS2) elS2.textContent = top2.total + ' pts';
                    if (elT3) elT3.textContent = top3.team;
                    if (elS3) elS3.textContent = top3.total + ' pts';

                    const podiumStage = document.getElementById('podium-stage');
                    if (podiumStage) podiumStage.classList.add('active');

                    // 6. Burst Confetti Poppers!
                    finaleTimer3 = setTimeout(() => {
                      try {
                        launchConfettiBurst();
                        setTimeout(launchConfettiBurst, 600);
                        setTimeout(launchConfettiBurst, 1500);
                        setSyncBadge('🎉 CHAMPIONS', '#00ff88');
                      } catch (e) {

      heroImg.className = 'hero-headtag-img';

      heroWrapper.style.transition = 'none';
      heroWrapper.style.position = 'fixed';
      heroWrapper.style.top = '50%';
      heroWrapper.style.left = '50%';
      heroWrapper.style.transform = 'translate(-50%, -50%)';

      heroWrapper.style.transition = '';

      // Step 1: After 0.8s, trigger 3D spin
      animTimer1 = setTimeout(() => {
        heroImg.classList.add('spinning');

      // Step 2: At 2.1s (spin finishes), glide to top of table and reveal the table
      animTimer2 = setTimeout(() => {

        const cRect = container.getBoundingClientRect();
        const vw = window.innerWidth;
        const targetWidth = Math.min(Math.max(350, vw * 0.40), 520);

      animTimer3 = setTimeout(() => {

        heroWrapper.style.left = '';

        heroWrapper.style.filter = '';
        heroWrapper.style.transition = '';

    // Google Sheets Real-Time Sync Poller
    const SHEET_ID = '1QVBnyGB20lW2_LnTtZyy8AML9HXpm6smeq9HziQ8BcE';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      let action = null;
      const teams = [];

      for (const line of lines) {
        const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
        if (cols.length === 0) continue;

        for (let i = 0; i < cols.length; i++) {
          const val = cols[i];
          const upper = val.toUpperCase();
          if (upper === 'ACTION' || upper === 'COMMAND' || upper === 'STATUS') {
            if (i + 1 < cols.length && cols[i + 1]) {
              action = cols[i + 1].trim();
            }
          } else if (['START', 'RESET', 'STANDBY'].includes(upper) || upper.startsWith('START ROUND') || upper.startsWith('ROUND ') || upper.startsWith('END ROUND') || upper.startsWith('END ROUNT') || upper.includes('FINALE')) {
            if (!action) action = val;
          }
        }

        const first = cols[0];
        const firstUpper = first.toUpperCase();
        if (firstUpper === 'TEAM' || firstUpper === 'ACTION' || firstUpper === 'RANK' || cols.some(c => c.toUpperCase().includes('ROUND 1'))) {
          continue;
        }

        if (first && isNaN(first)) {
          const teamName = first;
          const roundScores = [];
          for (let c = 1; c < cols.length; c++) {
            const num = parseFloat(cols[c]);
            roundScores.push(isNaN(num) ? 0 : num);
          }
          while (roundScores.length < 5) roundScores.push(0);
          const fiveRounds = roundScores.slice(0, 5);
          const total = fiveRounds.reduce((a, b) => a + b, 0);
          teams.push({
            team: teamName,
            rounds: fiveRounds,
            total: total
          });
        }
      }

      return { action, teams };
    }

    function parseGVizResponse(text) {
      try {
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonString);
        if (!data.table) return null;

        let action = null;
        const teams = [];

        if (data.table.cols) {
          for (const col of data.table.cols) {
            const label = (col.label || '').toUpperCase();
            if (label.includes('END ROUND') || label.includes('END ROUNT') || label.includes('FINALE')) {
              if (!action) action = 'END ROUND 5';
            } else if (label.includes('START ROUND') || label.includes('ROUND ')) {
              const m = label.match(/START ROUND \d+|ROUND \d+/);
              if (m && !action) action = m[0];
            } else if (label.includes('START') && !action) {
              action = 'START';
            } else if (label.includes('RESET') && !action) {
              action = 'RESET';
            }
          }
        }

        const rows = data.table.rows || [];
        for (let r = 0; r < rows.length; r++) {
          const row = rows[r];
          if (!row || !row.c) continue;

          const cells = row.c.map(c => (c && c.v !== undefined && c.v !== null) ? c.v : '');

          for (let i = 0; i < cells.length; i++) {
            const val = String(cells[i]).trim();
            const upper = val.toUpperCase();
            if (upper === 'ACTION' || upper === 'COMMAND' || upper === 'STATUS') {
              if (i + 1 < cells.length && cells[i + 1]) {
                action = String(cells[i + 1]).trim();
              }
            } else if (['START', 'RESET', 'STANDBY'].includes(upper) || upper.startsWith('START ROUND') || upper.startsWith('ROUND ') || upper.startsWith('END ROUND') || upper.startsWith('END ROUNT') || upper.includes('FINALE')) {
              if (!action) action = val;
            }
          }

          const firstText = String(cells[0] || '').trim();
          const firstUpper = firstText.toUpperCase();
          if (firstUpper === 'TEAM' || firstUpper === 'ACTION' || firstUpper === 'RANK' || cells.some(c => String(c).toUpperCase().includes('ROUND 1'))) {
            continue;
          }

          let teamName = '';
          const roundScores = [];

          if (isNaN(cells[0]) && cells[0]) {
            teamName = String(cells[0]).trim();
            for (let c = 1; c < cells.length; c++) {
              const num = parseFloat(cells[c]);
              if (!isNaN(num)) roundScores.push(num);
            }
          } else if (!isNaN(cells[0]) && isNaN(cells[1]) && cells[1]) {
            teamName = String(cells[1]).trim();
            for (let c = 2; c < cells.length; c++) {
              const num = parseFloat(cells[c]);
              if (!isNaN(num)) roundScores.push(num);
            }
          }

          if (teamName && (roundScores.length > 0 || teamName.toUpperCase().startsWith('TEAM '))) {
            while (roundScores.length < 5) roundScores.push(0);
            const fiveRounds = roundScores.slice(0, 5);
            const total = fiveRounds.reduce((a, b) => a + b, 0);
            teams.push({
              team: teamName,
              rounds: fiveRounds,
              total: total
            });
          }
        }

        return { action, teams };
      } catch (e) {
        return null;
      }
    }

    async function pollGoogleSheet() {
      try {
        let parsed = null;
        try {
          const resp = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_t=' + Date.now());
          if (resp.ok) {
            const text = await resp.text();
            parsed = parseCSV(text);
          }
        } catch (e) {}

        if (!parsed || (!parsed.action && parsed.teams.length === 0)) {
          const resp = await fetch(GVIZ_URL + '&_t=' + Date.now());
          if (resp.ok) {
            const text = await resp.text();
            parsed = parseGVizResponse(text);
          }
        }

        if (parsed) {
          const actionUpper = (parsed.action || '').toUpperCase();
          if (!isFinaleActive) {
            setSyncBadge(actionUpper || 'LIVE', '#ffd700');
          }

          // Save latest raw teams data
          if (parsed.teams && parsed.teams.length >= 2) {
            latestRawTeamsData = parsed.teams;
          }

          // Action State Machine
          if (actionUpper && actionUpper !== lastAction) {
            console.log('[Google Sheet Action]', actionUpper);
            lastAction = actionUpper;

            if (actionUpper === 'START') {
              isRound5Active = false;
              if (isFinaleActive) resetFinaleUI();
              if (!isIntroPlayed) {
                runIntroAnimation();
              }
            } else if (actionUpper === 'RESET' || actionUpper === 'STANDBY') {
              isRound5Active = false;
              resetToStandby();
            } else if (actionUpper.includes('END ROUND 5') || actionUpper.includes('ROUND 5 END') || actionUpper.includes('END ROUNT 5') || actionUpper.includes('FINALE') || actionUpper === 'END ROUND' || actionUpper === 'END ROUNT') {
              triggerEndRound5Finale(parsed.teams);
            } else if (actionUpper.startsWith('START ROUND') || actionUpper.startsWith('ROUND ')) {
              if (isFinaleActive) resetFinaleUI();
              const numMatch = actionUpper.match(/\d+/);
              if (numMatch) {
                const targetRound = parseInt(numMatch[0], 10);
                if (targetRound === 5) {
                  isRound5Active = true;
                } else {
                  isRound5Active = false;
                }
                const prev = targetRound > 1 ? targetRound - 1 : null;
                if (!isIntroPlayed) {
                  runIntroAnimation();
                  setTimeout(() => triggerRoundAnnouncement(prev, targetRound), 3300);
                } else {
                  triggerRoundAnnouncement(prev, targetRound);
                }
              }
            }
          }

          // If scores/teams present in sheet, update table (only when finale is not active)
          if (!isFinaleActive && parsed.teams && parsed.teams.length >= 2) {
            if (isRound5Active) {
              // ROUND 5 SUSPENSE MODE:
              // Keep Round 5 score hidden and freeze table order to Rounds 1-4 totals!
              const suspenseList = parsed.teams.map(t => {
                const r1to4 = t.rounds.slice(0, 4);
                const subtotal = r1to4.reduce((a, b) => a + (parseFloat(b) || 0), 0);
                return {
                  team: t.team,
                  rounds: [t.rounds[0], t.rounds[1], t.rounds[2], t.rounds[3], '—'],
                  total: subtotal,
                  fullRounds: t.rounds,
                  fullTotal: t.total,
                  revealR5: false
                };
              });
              updateLeaderboardWithAnimation(suspenseList, false);
            } else {
              updateLeaderboardWithAnimation(parsed.teams, false);
            }
          }
        }
      } catch (err) {
        if (!isFinaleActive) {
          setSyncBadge('CONNECTING', '#ff9999');
        }
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      renderLeaderboard(currentLeaderboard);
      resetToStandby(); // Wait in standby for Google Sheet 'START' command

      // Start live polling every 1.5s
      pollGoogleSheet();
      pollIntervalId = setInterval(pollGoogleSheet, 1500);
    });
